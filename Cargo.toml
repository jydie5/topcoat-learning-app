[package]
name = "topcoat-learning-app"
version = "0.1.0"
edition = "2024"
description = "A learning app for exploring the experimental Topcoat Rust web framework"
repository = "https://github.com/jydie5/topcoat-learning-app"
readme = "README.md"
publish = false

[dependencies]
argon2 = "0.5"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
toasty = { version = "0.9", features = ["sqlite"] }
tokio = { version = "1.51", features = ["rt-multi-thread", "macros", "sync", "time"] }
topcoat = { version = "0.4.0", features = [
    "font-fontsource",
    "htmx",
    "icon-iconify",
    "tailwind",
    "ui",
] }

[build-dependencies]
topcoat = { version = "0.4.0", default-features = false, features = [
    "icon-iconify",
    "tailwind",
] }
